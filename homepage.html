<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="homepage.css">
    <title>Car Dealership</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #2563a8;
            padding: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .logo {
            background-color: #cbd5e1;
            padding: 20px 30px;
            font-weight: bold;
            color: #333;
        }

        .nav-links {
            display: flex;
            list-style: none;
            flex: 1;
            margin-left: 20px;
        }

        .nav-links li {
            margin-right: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .user-icon {
            background-color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563a8;
            font-size: 20px;
        }

        .hero-section {
            background-color: #e5e7eb;
            padding: 60px 20px;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #1f2937;
        }

        .hero-image {
            max-width: 800px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .featured-section {
            padding: 60px 20px;
            background-color: white;
        }

        .featured-section h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 40px;
            color: #1f2937;
        }

        .featured-grid {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
            justify-content: center;
        }

        .featured-card {
            width: 280px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .featured-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .bookings-section {
            padding: 60px 20px;
            background-color: white;
        }

        .bookings-section h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 40px;
            color: #1f2937;
        }

        .bookings-grid {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 30px;
            justify-content: center;
        }

        .booking-card {
            background-color: #e5e7eb;
            padding: 60px 40px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .booking-card h3 {
            font-size: 18px;
            color: #1f2937;
        }

        .footer {
            background-color: #2563a8;
            padding: 30px 20px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 40px;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">LOGO</div>
            <ul class="nav-links">
                <li><a href="#">New cars</a></li>
                <li><a href="#">Used cars</a></li>
                <li><a href="#">Car reviews</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Finance & Insurance</a></li>
            </ul>
            <div class="user-icon">👤</div>
        </nav>
    </header>

    <section class="hero-section">
        <h1>Find Your perfect Vehicle Today</h1>
        <div class="hero-image">
            <img src="hero-car.jpg" alt="Featured Vehicle">
        </div>
    </section>

    <section class="featured-section">
        <h2>Featured Vehicles</h2>
        <div class="featured-grid">
            <div class="featured-card">
                <img src="car1.jpg" alt="Vehicle 1">
            </div>
            <div class="featured-card">
                <img src="car2.jpg" alt="Vehicle 2">
            </div>
            <div class="featured-card">
                <img src="car3.jpg" alt="Vehicle 3">
            </div>
            <div class="featured-card">
                <img src="car4.jpg" alt="Vehicle 4">
            </div>
        </div>
    </section>

    <section class="bookings-section">
        <h2>Quick Bookings</h2>
        <div class="bookings-grid">
            <div class="booking-card">
                <h3>Book a Vehicle</h3>
            </div>
            <div class="booking-card">
                <h3>Test drive</h3>
            </div>
            <div class="booking-card">
                <h3>Services</h3>
            </div>
        </div>
    </section>

    <footer class="footer">
        <ul class="footer-links">
            <li><a href="#">About</a></li>
            <li><a href="#">Terms</a></li>
            <li><a href="#">Privacy</a></li>
            <li><a href="#">Contact Info</a></li>
        </ul>
    </footer>
</body>
</html>
