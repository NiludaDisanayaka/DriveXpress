<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="homepage.css">
    <title>Car Dealership</title>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo">LOGO</div>
            <ul class="nav-links">
                <li><a href="#">New cars</a></li>
                <li><a href="#">Used cars</a></li>
                <li><a href="#">Car reviews</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Finance & Insurance</a></li>
            </ul>
            <div class="user-icon">👤</div>
        </nav>
    </header>

    <section class="hero-section">
        <h1>Find Your perfect Vehicle Today</h1>
        <div class="hero-image">
            <img src="hero-car.jpg" alt="Featured Vehicle">
        </div>
    </section>

    <section class="featured-section">
        <h2>Featured Vehicles</h2>
        <div class="featured-grid">
            <div class="featured-card">
                <img src="car1.jpg" alt="Vehicle 1">
            </div>
            <div class="featured-card">
                <img src="car2.jpg" alt="Vehicle 2">
            </div>
            <div class="featured-card">
                <img src="car3.jpg" alt="Vehicle 3">
            </div>
            <div class="featured-card">
                <img src="car4.jpg" alt="Vehicle 4">
            </div>
        </div>
    </section>

    <section class="bookings-section">
        <h2>Quick Bookings</h2>
        <div class="bookings-grid">
            <div class="booking-card">
                <h3>Book a Vehicle</h3>
            </div>
            <div class="booking-card">
                <h3>Test drive</h3>
            </div>
            <div class="booking-card">
                <h3>Services</h3>
            </div>
        </div>
    </section>

    <footer class="footer">
        <ul class="footer-links">
            <li><a href="#">About</a></li>
            <li><a href="#">Terms</a></li>
            <li><a href="#">Privacy</a></li>
            <li><a href="#">Contact Info</a></li>
        </ul>
    </footer>
</body>
</html>
