<!DOCTYPE html>
<html>
<head>
    <title>Book a Test Drive</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a class="nav-item" href="#">Services Overview</a>
        <a class="nav-item" href="#">Test Drive Booking</a>
        <a class="nav-item" href="#">Service Booking</a>
        <a class="nav-item" href="#">Maintenance & Repair</a>
        <a class="nav-item" href="#">Service History</a>
    </div>

    <div class="form-container">
        <h2>Book a Test Drive</h2>
        <hr>

        <form>

            <div class="row">
                <div class="input-group">
                    <label>Your name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="input-group">
                    <label>Phone number</label>
                    <input type="text" placeholder="Enter phone number">
                </div>
            </div>

            <div class="input-group full">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group full">
                <label>Select Car Model</label>
                <select>
                    <option>Select Car Model</option>
                    <option>SUV</option>
                    <option>Sedan</option>
                    <option>Hatchback</option>
                    <option>Electric</option>
                </select>
            </div>

            <div class="input-group full">
                <label>Select Dealer Branch</label>
                <select>
                    <option>Select Dealer Branch</option>
                    <option>Colombo</option>
                    <option>Kandy</option>
                    <option>Galle</option>
                    <option>Jaffna</option>
                </select>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Choose Date</label>
                     <input type="date">
                    
                </div>

                <div class="input-group">
                    <label>Choose Time</label>
                    <input type="Time">
                    
                </div>
            </div>

            <div class="input-group full">
                <label>Notes Section</label>
                <input type="text" placeholder="Add any notes here">
            </div>

            <button class="submit-btn">BOOK TEST DRIVE</button>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="#">About</a>
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Contact Info</a>
    </div>

</body>
</html>
