<!DOCTYPE html>
<html >
<head>
    
    <title>Instant Car Insurance Quotation</title>
    

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f25, #1b2a4a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            width: 90%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            top: -120px;
            right: -120px;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #6b73ff;
            box-shadow: 0 0 0 3px rgba(107, 115, 255, 0.2);
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: linear-gradient(90deg, #6b73ff, #2bff88);
            color: #111;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .quote-result {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            display: none;
        }

        .quote-result h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .quote-result p {
            font-size: 14px;
            margin-bottom: 6px;
            color: rgba(255,255,255,0.85);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Instant Car Insurance Quotation</h2>
    <p class="subtitle">Get your estimated premium instantly without waiting</p>

    <label>Car Value (LKR)</label>
    <input type="number" id="carValue" placeholder="Enter car value">

    <label>Car Age (Years)</label>
    <input type="number" id="carAge" placeholder="Enter car age">

    <label>Policy Duration (Years)</label>
    <select id="duration">
        <option value="1">1 Year</option>
        <option value="2">2 Years</option>
        <option value="3">3 Years</option>
    </select>

    <button onclick="calculateQuote()">Get Estimated Quote</button>

    <!-- QUOTATION DISPLAY -->
    <div class="quote-result" id="quoteResult">
        <h3>Estimated Quotation</h3>
        <p><strong>Car Value:</strong> LKR <span id="rValue"></span></p>
        <p><strong>Policy Duration:</strong> <span id="rDuration"></span> year(s)</p>
        <p><strong>Estimated Premium:</strong> LKR <span id="rPremium"></span></p>
    </div>

</div>

<script>
    function calculateQuote() {
        let value = document.getElementById("carValue").value;
        let age = document.getElementById("carAge").value;
        let duration = document.getElementById("duration").value;

        if (value === "" || age === "") {
            alert("Please fill all fields");
            return;
        }

        let baseRate = 0.04; // 4% base rate

        if (age > 5) {
            baseRate += 0.01;
        }

        let premium = value * baseRate * duration;

        document.getElementById("rValue").innerText = value;
        document.getElementById("rDuration").innerText = duration;
        document.getElementById("rPremium").innerText = premium.toFixed(2);

        document.getElementById("quoteResult").style.display = "block";
    }
</script>

</body>
</html>
