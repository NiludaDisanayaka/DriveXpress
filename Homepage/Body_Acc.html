<!DOCTYPE html>
<html>
<head>

<title>Body / Accident Repair</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #f0f4ff 0%, #eaf0f7 60%, #f8fbff 100%);
    margin: 0;
  }

  .container {
    max-width: 900px;
    margin: 40px auto;
    background: #fff;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
  }

  /* Decorative Background */
  .container::before {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle at center, #c9d9ff 0%, #f0f4ff 60%, transparent 70%);
    top: -120px;
    right: -120px;
    opacity: 0.8;
    transform: rotate(20deg);
  }

  h1 {
    color: #0a2a52;
    margin-bottom: 5px;
  }

  p {
    color: #4a5a75;
    font-size: 16px;
  }

  h3 {
    color: #1f3b6a;
    margin-top: 30px;
  }

  /* Issue Cards */
  .issues {
    display: flex;
    gap: 15px;
    margin-top: 20px;
  }

  .issue-card {
    flex: 1;
    background: #f5f8ff;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #e0e7ff;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .issue-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  .issue-card i {
    font-size: 22px;
    color: #003366;
    margin-bottom: 8px;
  }

  /* Form */
  form {
    margin-top: 25px;
  }

  input[type="text"],
  input[type="file"],
  select {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #c9d9ff;
    outline: none;
    font-size: 16px;
  }

  input:focus,
  select:focus {
    border-color: #003366;
    box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.15);
  }

  label {
    display: block;
    margin-top: 10px;
    font-weight: 600;
    color: #1f3b6a;
  }

  button {
    margin-top: 20px;
    padding: 14px;
    width: 100%;
    background: #003366;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.3s ease;
  }

  button:hover {
    background: #001f3a;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .issues {
      flex-direction: column;
    }
  }
</style>
</head>

<body>
<div class="container">
  <h1>Body / Accident Repair</h1>
  <p>Professional accident repair and paintwork for a flawless finish.</p>

  <h3>Services Included</h3>

  <div class="issues">
    <div class="issue-card">
      <i class="fa-solid fa-car-crash"></i>
      <p><b>Accident Repair</b></p>
    </div>

    <div class="issue-card">
      <i class="fa-solid fa-paint-roller"></i>
      <p><b>Paint Work</b></p>
    </div>

    <div class="issue-card">
      <i class="fa-solid fa-screwdriver-wrench"></i>
      <p><b>Panel Replacement</b></p>
    </div>
  </div>

  <h3>Submit Damage Details</h3>
  <form>
    <input type="text" placeholder="Accident Type">
    <input type="file">
    <select>
      <option>Insurance Claim</option>
      <option>Private Repair</option>
    </select>
    <button>Submit Damage Details</button>
  </form>
</div>
</body>
</html>
